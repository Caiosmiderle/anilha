# Compila o Anilha para iPhone num Mac do GitHub e publica o .ipa NÃO assinado.
# A assinatura acontece no PC do Caio, pelo Sideloadly, com o mesmo Apple ID do CRUNNING.
# Roda quando pedido (aba Actions > iOS > Run workflow, a partir da main) ou a cada push numa
# branch claude/ios-* ou codex/ios-* que mexa no app. Repositório público: minutos grátis.
name: iOS

on:
  workflow_dispatch:
    inputs:
      publicar_release:
        description: 'Publicar o .ipa também como Release (link fixo para baixar)'
        type: boolean
        default: true
      prints_letra_grande:
        description: 'Tirar também os prints com letra grande (dobra o tempo dos prints)'
        type: boolean
        default: false
  push:
    # Any Claude or Codex branch (revisao-ficha, memoria-analise and missao did not match ios-*).
    branches: ['claude/**', 'codex/**']
    paths:
      [
        'ios/**',
        'src/engine/**',
        'src/analysis/**',
        'src/review/**',
        'supabase/functions/revisao-ficha/**',
        'scripts/build-review.mjs',
        'scripts/ios-review-source.ts',
        'tests/e2e/review.spec.ts',
        'src/agent/**',
        'supabase/functions/analise-treino/**',
        'scripts/build-analysis.mjs',
        'scripts/ios-analysis-source.ts',
        'scripts/ios-evolution-source.ts',
        'tests/e2e/analysis.spec.ts',
        'tests/e2e/calendario-integrado.spec.ts',
        'scripts/ios-calendar-source.ts',
        'scripts/ios-history-source.ts',
        'src/screens/Calendar.tsx',
        'src/screens/SessionDetail.tsx',
        'src/styles/app.css',
        'src/engine/__tests__/iosDemo.test.ts',
        'scripts/ios-source.ts',
        'scripts/ios-training-source.ts',
        'scripts/ios-session-source.ts',
        'tests/e2e/ios-treino.spec.ts',
        'tests/e2e/helpers.ts',
        'playwright*.config.ts',
        'src/screens/parts/setValues.ts',
        'scripts/local-api-node.mjs',
        'server/**',
        'src/data/**',
        'src/sync/**',
        'supabase/migrations/**',
        'scripts/generate-ios.mjs',
        '.env.production',
        'package.json',
        'package-lock.json',
        'public/icon-512.png',
        '.github/workflows/ios.yml',
      ]

permissions:
  contents: write # necessário para criar a Release

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: ios

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - name: Baixar o código
        uses: actions/checkout@v6

      - name: Escolher o Xcode estável mais novo
        run: |
          XCODE=$(ls -d /Applications/Xcode_[0-9]*.app | grep -viE 'beta|rc|release_candidate' | sort -V | tail -1)
          echo "Usando $XCODE"
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - name: Preparar Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm

      - name: Gerar catálogo e vetores do motor TypeScript
        working-directory: .
        run: |
          npm ci
          node scripts/generate-ios.mjs
          node scripts/generate-ios.mjs --check
          node scripts/build-analysis.mjs --check
          node scripts/build-review.mjs --check
          npx vitest run src/engine/__tests__/iosArtifacts.test.ts src/engine/__tests__/iosDemo.test.ts src/engine/__tests__/iosHistory.test.ts src/engine/__tests__/calendar.test.ts src/analysis/__tests__/analysis.test.ts src/analysis/__tests__/memory.test.ts src/analysis/__tests__/evolution.test.ts tests/db/analysis.test.ts src/review/__tests__/review.test.ts src/content/__tests__/howtoIos.test.ts src/data/__tests__/duplicates.test.ts --maxWorkers=1 --no-file-parallelism

      - name: Testar paridade, gravação e fila Swift
        working-directory: .
        env:
          ANILHA_NATIVE_PAYLOAD: ${{ github.workspace }}/.local/ios-native-payload.json
        run: swift test --package-path ios/AnilhaCore

      - name: Conferir payload Swift no servidor e PWA locais
        working-directory: .
        env:
          ANILHA_NATIVE_PAYLOAD: ${{ github.workspace }}/.local/ios-native-payload.json
        run: |
          npx playwright install chromium
          npx playwright test -c playwright.node.config.ts tests/e2e/ios-treino.spec.ts tests/e2e/analysis.spec.ts tests/e2e/review.spec.ts tests/e2e/calendario-integrado.spec.ts

      - name: Gerar o ícone 1024 a partir do ícone do PWA
        run: |
          sips -z 1024 1024 ../public/icon-512.png --out App/Recursos/Assets.xcassets/AppIcon.appiconset/AppIcon-1024.png
          sips -g pixelWidth -g pixelHeight App/Recursos/Assets.xcassets/AppIcon.appiconset/AppIcon-1024.png

      - name: Instalar o XcodeGen
        run: brew install xcodegen

      - name: Gerar o projeto do Xcode
        run: xcodegen generate

      - name: Compilar (archive sem assinatura)
        run: |
          set -o pipefail
          build_status=0
          xcodebuild archive \
            -project Anilha.xcodeproj \
            -scheme Anilha \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Anilha.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            COMPILER_INDEX_STORE_ENABLE=NO \
            > "$RUNNER_TEMP/xcodebuild.log" 2>&1 || build_status=$?
          echo "Erros e avisos do compilador (sem repetição):"
          grep -E 'error:|warning:' "$RUNNER_TEMP/xcodebuild.log" | sed "s|$GITHUB_WORKSPACE/||" | sort -u || echo "nenhum"
          grep -E '\*\* (ARCHIVE|BUILD) (SUCCEEDED|FAILED) \*\*' "$RUNNER_TEMP/xcodebuild.log" || true
          test "$build_status" -eq 0
          test -d "$RUNNER_TEMP/Anilha.xcarchive/Products/Applications/Anilha.app"

      - name: Guardar o log do Xcode se falhar
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: xcodebuild-log-${{ github.run_number }}
          path: ${{ runner.temp }}/xcodebuild.log
          retention-days: 7

      - name: Empacotar o .ipa
        run: |
          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          cp -R "$RUNNER_TEMP/Anilha.xcarchive/Products/Applications/Anilha.app" "$RUNNER_TEMP/ipa/Payload/"
          (cd "$RUNNER_TEMP/ipa" && zip -qry "$GITHUB_WORKSPACE/Anilha.ipa" Payload)
          ls -lh "$GITHUB_WORKSPACE/Anilha.ipa"
          (cd "$GITHUB_WORKSPACE" && shasum -a 256 Anilha.ipa | tee Anilha.ipa.sha256)

      - name: Guardar o .ipa como artefato
        uses: actions/upload-artifact@v6
        with:
          name: Anilha-ios-build-${{ github.run_number }}
          path: |
            Anilha.ipa
            Anilha.ipa.sha256
          retention-days: 30
          if-no-files-found: error

      - name: Publicar a Release
        if: github.event_name == 'push' || inputs.publicar_release
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="ios-build-${{ github.run_number }}"
          gh release create "$TAG" Anilha.ipa Anilha.ipa.sha256 \
            --target "$GITHUB_SHA" \
            --title "Anilha iOS $TAG" \
            --notes "Build ${{ github.run_number }} (commit ${GITHUB_SHA::7}). .ipa NÃO assinado: instale pelo Sideloadly com o mesmo Apple ID do CRUNNING." \
            --prerelease

  # Prints depois do .ipa, num Mac separado: o .ipa sai sem esperar o simulador.
  prints:
    needs: build
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Baixar o código
        uses: actions/checkout@v6

      - name: Escolher o Xcode estável mais novo
        run: |
          XCODE=$(ls -d /Applications/Xcode_[0-9]*.app | grep -viE 'beta|rc|release_candidate' | sort -V | tail -1)
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - name: Preparar Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm

      - name: Gerar catálogo e vetores do motor TypeScript
        working-directory: .
        run: |
          npm ci
          node scripts/generate-ios.mjs

      - name: Gerar o projeto do Xcode
        run: |
          sips -z 1024 1024 ../public/icon-512.png --out App/Recursos/Assets.xcassets/AppIcon.appiconset/AppIcon-1024.png
          brew install xcodegen
          xcodegen generate

      - name: Capturar SwiftUI no simulador em claro e escuro
        id: screenshots
        continue-on-error: true
        timeout-minutes: 20
        env:
          CAPTURA_TAMANHOS: ${{ inputs.prints_letra_grande && 'large accessibility3' || 'large' }}
        run: bash scripts/capture-screenshots.sh

      - name: Guardar os prints SwiftUI como artefato
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v6
        with:
          name: Anilha-SwiftUI-ios-build-${{ github.run_number }}
          path: |
            Anilha-SwiftUI.zip
            artifacts/ios-native/
          retention-days: 30
          if-no-files-found: warn

      - name: Anexar os prints à Release
        if: always() && (github.event_name == 'push' || inputs.publicar_release)
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="ios-build-${{ github.run_number }}"
          if [ -f Anilha-SwiftUI.zip ]; then
            gh release upload "$TAG" Anilha-SwiftUI.zip --clobber
          else
            echo '::warning::Release sem prints SwiftUI. Confira o passo de captura.'
          fi
          if [ "${{ steps.screenshots.outcome }}" = "failure" ]; then
            echo '::warning::Capturas SwiftUI falharam ou ficaram incompletas. Confira Anilha-SwiftUI.zip e os logs.'
          fi
